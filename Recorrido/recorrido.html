<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Plata · Recorrido UV Nocturno</title>
   
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
   
    <link rel="stylesheet" href="recorrido.css">
</head>
<body class="day">

    <!-- El mapa ahora ocupa toda la pantalla -->
    <div id="map">
        <div id="particles"></div>
        <div id="darkness-overlay"></div>
        <canvas id="stars"></canvas>
        <div id="uv-halo"></div>

        <button class="btn-gyro" id="btnGyro">
            <span class="gyro-icon">📱</span>
            <span id="gyroText">Activar giroscopio</span>
        </button>

        <div class="flashlight-hint">
            <span class="pulse-icon"></span>
            <span>Pasá la luz UV para descubrir el recorrido</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    
    <script src="app.js"></script>
</body>
</html>
